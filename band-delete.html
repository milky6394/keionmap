<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バンド削除 - 部内管理システム</title>
  <link rel="stylesheet" href="css/style.css?v=20261112-style-externalized">
</head>
<body>

  <div class="card members-card band-delete-card">
    <h2>🗑️ バンド削除</h2>
    <p class="subtitle">削除したいバンドを選択してください</p>

    <!-- バンド選択 -->
    <div class="form-group">
      <label>削除するバンド</label>
      <select id="select-band-to-delete" class="band-select">
        <option value="">-- バンドを選択してください --</option>
      </select>
    </div>

    <!-- 削除確認プレビュー（未選択時は非表示） -->
    <div id="delete-confirm-area" class="hidden">
      <div class="danger-zone">
        <p class="delete-warning-title">⚠️ 以下のバンドを削除しますか？</p>
        <p class="delete-warning-description">この操作は取り消せません。バンドおよび構成メンバーデータが削除されます。</p>

        <div class="band-preview-box">
          <p id="preview-band-name" class="delete-preview-band-name"></p>
          <p id="preview-members-text" class="delete-preview-members"></p>
        </div>

        <button id="delete-btn" class="btn-danger">このバンドを削除する</button>
      </div>
      <div id="msg-delete" class="message error delete-message"></div>
    </div>

    <hr class="divider">
    <a href="bands.html"><button class="btn-secondary">バンド管理トップへ戻る</button></a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/band-delete.js"></script>
</body>
</html>
