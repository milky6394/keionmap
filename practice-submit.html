<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習希望入力 | 部活管理システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div style="margin-bottom: 10px;">
        <a href="practice.html"><button class="btn-secondary">戻る</button></a>
      </div>
      <h1>📅 練習希望の入力・変更</h1>
      <p class="subtitle">各曜日の希望状況（✕・◯・◎）を選択して保存してください。</p>
    </header>

    <main>
      <!-- ローディング表示 -->
      <div id="loading" class="loading-box">
        <p>コマ枠データを読み込み中...</p>
      </div>

      <!-- 希望入力フォーム -->
      <form id="wish-form" style="display: none;" onsubmit="handleSubmitWishes(event)">
        
        <!-- 月〜金曜日ごとのコマ枠が入るコンテナ -->
        <div id="weekday-container" class="weekday-container"></div>

        <div class="form-actions sticky-bottom">
          <button type="submit" id="submit-btn" class="btn btn-primary">
            💾 練習希望を保存・更新する
          </button>
        </div>
      </form>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/practice-submit.js"></script>
</body>
</html>
