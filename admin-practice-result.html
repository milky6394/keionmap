<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>練習割り当て管理 | 部活管理システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🎸 練習割り当て管理（管理者）</h1>
      <p class="subtitle">現時点の希望データを元に割当を自動作成・個別調整できます。</p>
    </header>

    <main>
      <!-- アクションエリア -->
      <div class="admin-actions-bar">
        <button id="btn-calculate" class="btn btn-primary" onclick="runCreateAssignments()">
          ⚡ 現時点の希望から割当を作成・更新する
        </button>
      </div>

      <!-- ローディング表示 -->
      <div id="loading" class="loading-box">
        <p>コマ枠・割り当てデータを読み込み中...</p>
      </div>

      <!-- 割当結果表示（月〜金） -->
      <div id="result-container" style="display: none;">
        <div id="weekday-grid-container" class="weekday-container"></div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin-practice-result.js"></script>
</body>
</html>
