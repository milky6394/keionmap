<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軽音セッティング図 - 部内管理システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card stage-card">
    <h2>軽音セッティング図</h2>
    <p class="subtitle">確認したいステージのセッティングを選択してください</p>

    <!-- 部員名簿画面（members.html）と同じmenu-stack構造に変更 -->
    <div class="menu-stack">
      <a href="map1.html" class="menu-card member-menu-item">
        <div class="menu-icon">🎪</div>
        <div class="menu-text">
          <div class="menu-title">体育館ステージ</div>
          <div class="menu-desc">体育館ステージのセッティング図を確認</div>
        </div>
      </a>

      <a href="map2.html" class="menu-card member-menu-item">
        <div class="menu-icon">🎪</div>
        <div class="menu-text">
          <div class="menu-title">高専祭野外ステージ</div>
          <div class="menu-desc">野外ステージのセッティング図を確認</div>
        </div>
      </a>

      <a href="map3.html" class="menu-card member-menu-item">
        <div class="menu-icon">🎪</div>
        <div class="menu-text">
          <div class="menu-title">サマフェスT棟前</div>
          <div class="menu-desc">T棟前ステージのセッティング図を確認</div>
        </div>
      </a>
    </div>

    <hr class="divider">

    <button type="button" onclick="location.href='dashboard.html'" class="btn-secondary">
      トップへ戻る
    </button>
  </div>

  <script>
    // 未ログインアクセス防止用ガード
    document.addEventListener('DOMContentLoaded', () => {
      if (!sessionStorage.getItem('user')) {
        alert('ログインしてください');
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
