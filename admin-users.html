<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー管理 - 管理者メニュー</title>
  <link rel="stylesheet" href="css/style.css?v=20261112-style-externalized">
</head>
<body class="admin-users-page">

  <div class="container admin-users-container">
    <header class="header">
      <h1>👥 ユーザー管理（管理者用）</h1>
      <p class="subtitle">部員の登録情報編集・強制退部処理を行います</p>
    </header>
    <div>
      <a href="admin.html"><button class="btn-secondary">管理者メニューへ戻る</button></a>
    </div>
    
    <!-- 絞り込み検索 -->
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="名前や担当パートで検索...">
      <select id="gradeFilter">
        <option value="all">全学年</option>
        <option value="1">1年</option>
        <option value="2">2年</option>
        <option value="3">3年</option>
        <option value="4">4年</option>
        <option value="5">5年</option>
      </select>
    </div>

    <!-- ユーザー一覧テーブル（居住形態ヘッダーも削除） -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>名前</th>
            <th>学年/クラス</th>
            <th>担当パート</th>
            <th>所属バンド</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr><td colspan="5" class="admin-users-loading">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- ✏️ 編集モーダル -->
  <div id="edit-modal" class="modal-overlay">
    <div class="card members-card">
      <h2>✏️ 登録内容の変更 (管理者操作)</h2>
      <p class="subtitle"><b id="display-username"></b> さんの登録情報を編集します</p>

      <input type="hidden" id="edit-target-username">

      <div class="form-group">
        <label>学年</label>
        <select id="edit-grade-select">
          <option value="1">1年</option>
          <option value="2">2年</option>
          <option value="3">3年</option>
          <option value="4">4年</option>
          <option value="5">5年</option>
        </select>
      </div>

      <!-- 1・2年生のみ表示されるクラス入力欄 -->
      <div class="form-group" id="edit-class-group">
        <label>クラス</label>
        <input type="text" id="edit-class-input" placeholder="例: 1組">
      </div>

      <div class="form-group">
        <label>学科</label>
        <select id="edit-course-select">
          <option value="M">機械</option>
          <option value="E">電気</option>
          <option value="S">制御</option>
          <option value="C">建設</option>
        </select>
      </div>

      <div class="form-group">
        <label>学籍番号</label>
        <input type="text" id="edit-number-input" placeholder="例: 230101">
      </div>

      <div class="form-group">
        <label>性別</label>
        <select id="edit-gender-select">
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="その他">その他</option>
        </select>
      </div>

      <div class="form-group">
        <label>居住形態</label>
        <select id="edit-dormitory-select">
          <option value="false">通生</option>
          <option value="true">寮生</option>
        </select>
      </div>

      <!-- 寮生のみ表示されるオプション -->
      <div id="edit-dorm-options" class="hidden">
        <div class="form-group">
          <label>部屋番号</label>
          <input type="text" pattern="\d*" id="edit-room-input" placeholder="例: 6213">
        </div>
        <div class="form-group">
          <label>部屋タイプ</label>
          <select id="edit-single-select">
            <option value="false">二人部屋</option>
            <option value="true">一人部屋</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>LINEの名前</label>
        <input type="text" id="edit-line-input" placeholder="LINEの表示名">
      </div>

      <div class="form-group">
        <label>兼部先 (なければ「なし」)</label>
        <input type="text" id="edit-multi-input" placeholder="例: サッカー部">
      </div>

      <button id="save-edit-btn" class="btn-primary">変更内容を保存</button>
      <div id="msg-edit" class="message error"></div>

      <hr class="divider">
      <button type="button" class="btn-secondary" id="close-edit-modal-btn">キャンセル</button>
    </div>
  </div>

  <!-- 🗑️ 削除モーダル -->
  <div id="delete-modal" class="modal-overlay">
    <div class="card members-card">
      <h2>🗑️ アカウント削除 (強制退部)</h2>
      <p class="subtitle"><b id="delete-display-username"></b> さんのアカウントを削除します</p>

      <div class="warning-box">
        <p><b>⚠️ 注意事項</b></p>
        <p>アカウントを削除すると部員名簿から完全にデータが消去され、元に戻すことはできません。</p>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="delete-confirm-check">
          注意事項を理解した上で退部させます
        </label>
      </div>

      <button id="delete-account-btn" class="btn-danger" disabled>アカウントを削除して退部させる</button>
      <div id="msg-delete" class="message error"></div>

      <hr class="divider">
      <button type="button" class="btn-secondary" id="close-delete-modal-btn">キャンセル</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
