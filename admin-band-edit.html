<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【管理者】バンド情報編集・削除 - 部内管理システム</title>
  <link rel="stylesheet" href="css/style.css?v=20261112-style-externalized">
</head>
<body>

  <div class="card members-card band-form-card admin-band-edit-card">
    <h2>👑 バンド情報の編集・削除（管理者）</h2>
    <p class="subtitle">部内のすべてのバンド情報を更新または削除できます</p>

    <!-- バンド選択 -->
    <div class="form-group">
      <label>対象のバンドを選択</label>
      <select id="select-band-to-edit" class="band-select">
        <option value="">-- 読み込み中... --</option>
      </select>
    </div>

    <!-- 編集フォーム（未選択時は非表示） -->
    <div id="edit-form-area" class="band-edit-form hidden">
      <hr class="divider band-edit-divider">

      <!-- バンド名入力 -->
      <div class="form-group">
        <label>バンド名</label>
        <input type="text" id="band-name-input" placeholder="例: The Blue Hearts">
      </div>

      <div class="form-group">
        <label for="current-songs-input">現在取り組んでいる曲</label>
        <textarea id="current-songs-input" rows="3" placeholder="曲名を入力（複数ある場合は改行して入力）"></textarea>
      </div>

      <!-- メンバー編集エリア -->
      <div class="form-group">
        <label>メンバー構成</label>
        <div id="member-list">
          <!-- 動的にメンバー行が挿入されます -->
        </div>
        <button type="button" id="add-member-row-btn" class="btn-secondary band-add-member-button">＋ メンバーを追加</button>
      </div>

      <button id="save-band-btn" class="btn-primary band-save-button">更新内容を保存する</button>
      <div id="msg-band" class="message error"></div>

      <!-- 危険エリア：バンド削除機能 -->
      <div class="danger-zone-card">
        <h3 class="danger-zone-title">⚠️ バンドの削除</h3>
        <p class="danger-zone-description">
          選択中のバンドをデータベースから完全に削除します。<br>
          誤操作防止のため、下のチェックボックスを有効にしてから削除ボタンを押してください。
        </p>

        <label class="danger-zone-confirm-label">
          <input type="checkbox" id="confirm-delete-checkbox">
          このバンドを完全に削除することを了解しました
        </label>

        <button id="delete-band-btn" class="btn-danger" disabled>このバンドを削除する</button>
        <div id="msg-delete" class="message error danger-zone-message"></div>
      </div>
    </div>

    <hr class="divider">
    <a href="admin.html"><button class="btn-secondary" id="back-btn">バンド管理トップへ戻る</button></a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin-band-edit.js"></script>
</body>
</html>
