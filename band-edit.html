<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バンド情報の編集 - 部内管理システム</title>
  <link rel="stylesheet" href="css/style.css?v=20261112-style-externalized">
</head>
<body>

  <div class="card members-card band-form-card">
    <h2>✏️ バンド情報の編集</h2>
    <p class="subtitle">編集するバンドを選択し、内容を変更してください</p>

    <!-- バンド選択 -->
    <div class="form-group">
      <label>編集するバンドを選択</label>
      <select id="select-band-to-edit" class="band-select">
        <option value="">-- バンドを選択してください --</option>
      </select>
    </div>

    <!-- 編集フォーム（バンド未選択時は非表示） -->
    <div id="edit-form-area" class="band-edit-form hidden">
      <hr class="divider band-edit-divider">

      <!-- バンド名入力 -->
      <div class="form-group">
        <label>バンド名</label>
        <input type="text" id="band-name-input" placeholder="例: The Blue Hearts">
      </div>

      <div class="form-group">
        <label for="current-songs-input">現在取り組んでいる曲</label>
        <textarea id="current-songs-input" rows="3" placeholder="曲名を入力（複数ある場合は改行して入力）"></textarea>
      </div>

      <!-- メンバー編集エリア -->
      <div class="form-group">
        <label>メンバー構成</label>
        <div id="member-list">
          <!-- 動的にメンバー行が挿入されます -->
        </div>
        <button type="button" id="add-member-row-btn" class="btn-secondary band-add-member-button">＋ メンバーを追加</button>
      </div>

      <button id="save-band-btn" class="btn-primary band-save-button">更新内容を保存する</button>
      <div id="msg-band" class="message error"></div>
    </div>

    <hr class="divider">
    <a href="bands.html"><button class="btn-secondary" id="back-btn">バンド管理トップへ戻る</button></a>
  </div>

  <script src="js/config.js"></script>
  <script src="js/band-edit.js"></script>
</body>
</html>
